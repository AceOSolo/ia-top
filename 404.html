<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | IA Top</title>

  <meta name="theme-color" content="#F3EEE5">

  <!-- Page autonome : les styles sont intégrés pour qu'elle s'affiche bien à n'importe quelle adresse -->
  <style>
    :root { --papier:#F3EEE5; --lin:#E7E0D3; --encre:#16130F; --graphite:#5D5850; --vermillon:#E0482A; }
    @font-face { font-family:"Newsreader"; src:url("assets/fonts/newsreader-roman.woff2") format("woff2"); font-weight:300 550; font-display:swap; }
    @font-face { font-family:"Newsreader"; src:url("assets/fonts/newsreader-italic.woff2") format("woff2"); font-weight:300 550; font-style:italic; font-display:swap; }
    @font-face { font-family:"Schibsted Grotesk"; src:url("assets/fonts/schibsted-grotesk.woff2") format("woff2"); font-weight:400 700; font-display:swap; }
    *, *::before, *::after { box-sizing:border-box; }
    html { background:var(--papier); }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--papier); color:var(--encre);
      font-family:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; font-size:1.0625rem; line-height:1.6; }
    .wrap { flex:1; width:100%; max-width:1360px; margin:0 auto; padding:1.25rem 20px 3rem; display:flex; flex-direction:column; }
    .top { display:flex; justify-content:space-between; align-items:center; padding-bottom:1rem; border-bottom:1px solid var(--encre); }
    .logo { display:block; width:auto; height:30px; }
    .tag { font-size:.6875rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
    main { margin:auto 0; padding:4rem 0 2rem; }
    .code { margin:0; font-family:"Newsreader", Georgia, serif; font-style:italic; font-weight:300; font-size:clamp(7rem,30vw,18rem); line-height:.8; letter-spacing:-.05em; color:var(--vermillon); }
    h1 { margin:1.5rem 0 1rem; max-width:14ch; font-family:"Newsreader", Georgia, serif; font-weight:400; font-size:clamp(2.5rem,7vw,5rem); line-height:1; letter-spacing:-.03em; }
    p { margin:0; max-width:32rem; color:var(--graphite); }
    .btn { display:inline-flex; align-items:center; gap:.75em; min-height:56px; margin-top:2.25rem; padding:1rem 1.6rem;
      background:var(--encre); color:var(--papier); font-weight:600; text-decoration:none; }
    .btn:hover { background:var(--vermillon); color:var(--encre); }
    .btn svg { width:1.15em; height:1.15em; }
    a:focus-visible { outline:3px solid var(--vermillon); outline-offset:3px; }
    @media (min-width:768px) { .wrap { padding-inline:48px; } .logo { height:32px; } }
  </style>
</head>
